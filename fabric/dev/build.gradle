// Dev runner: `./gradlew :dev:runClient` loads every module from the sibling projects' named jars.
base { archivesName = 'slate-dev' }

loom {
    runs {
        client {
            client()
            runDir 'run'
            // Unattended screenshot runs: -PautoScreens=slate:hub,slate:settings [-PautoSkin=VANILLA] [-PautoQuit=true]
            if (project.hasProperty('autoScreens') || project.hasProperty('autoWorld')) {
                if (project.hasProperty('autoScreens')) vmArg "-Dslate.autoScreens=${project.autoScreens}"
                vmArg "-Dslate.autoDir=${file('run').absolutePath}"
                vmArg "-Dslate.autoQuit=${project.hasProperty('autoQuit') ? project.autoQuit : 'true'}"
                if (project.hasProperty('autoSkin')) vmArg "-Dslate.autoSkin=${project.autoSkin}"
                if (project.hasProperty('autoWorld')) vmArg "-Dslate.autoWorld=${project.autoWorld}"
                if (project.hasProperty('autoFrames')) vmArg "-Dslate.autoFrames=${project.autoFrames}"
            }
        }
        server {
            server()
            runDir 'run-server'
        }
    }
}

dependencies {
    implementation project(path: ':core', configuration: 'namedElements')
    implementation project(path: ':menu', configuration: 'namedElements')
    implementation project(path: ':multiplayer', configuration: 'namedElements')
    implementation project(path: ':chat', configuration: 'namedElements')
    implementation project(path: ':config', configuration: 'namedElements')
}

tasks.named('jar') { enabled = false }
tasks.named('remapJar') { enabled = false }
