// Dev runner: `./gradlew :dev:runClient` loads every module from the sibling projects' named jars.
base { archivesName = 'slate-dev' }

loom {
    runs {
        client {
            client()
            runDir 'run'
            if (project.hasProperty('buildingHarness')) {
                // Slate Building scenario runs: -PbuildingHarness=smoke,render [-PautoSkin=VANILLA]. The building
                // harness creates its own flat world and quits by itself, so Core's screenshot harness stays off
                // for this run (it would open a second world and quit underneath the scenarios).
                vmArg "-Dslate.building.harness=${project.buildingHarness}"
                if (project.hasProperty('autoSkin')) vmArg "-Dslate.autoSkin=${project.autoSkin}"
                if (project.hasProperty('autoLayout')) vmArg "-Dslate.autoLayout=${project.autoLayout}"
            } else if (project.hasProperty('autoScreens') || project.hasProperty('autoWorld')) {
                // Unattended screenshot runs: -PautoScreens=slate:hub,slate:settings [-PautoSkin=VANILLA] [-PautoQuit=true]
                if (project.hasProperty('autoScreens')) vmArg "-Dslate.autoScreens=${project.autoScreens}"
                vmArg "-Dslate.autoDir=${file('run').absolutePath}"
                vmArg "-Dslate.autoQuit=${project.hasProperty('autoQuit') ? project.autoQuit : 'true'}"
                if (project.hasProperty('autoSkin')) vmArg "-Dslate.autoSkin=${project.autoSkin}"
                if (project.hasProperty('autoLayout')) vmArg "-Dslate.autoLayout=${project.autoLayout}"
                if (project.hasProperty('autoWorld')) vmArg "-Dslate.autoWorld=${project.autoWorld}"
                if (project.hasProperty('autoFrames')) vmArg "-Dslate.autoFrames=${project.autoFrames}"
            }
        }
        server {
            server()
            runDir 'run-server'
        }
    }
}

// Which modules are on the dev runtime: all, or the ones named in -PslateModules=core,menu,config (the install matrix
// of docs/LAYOUTS-PLAN.md §7). Core is always on; chat brings multiplayer.
def slateModules = { ->
    def all = ['core', 'menu', 'multiplayer', 'chat', 'config', 'building']
    if (!project.hasProperty('slateModules')) return all
    def wanted = project.slateModules.toString().split(',').collect { it.trim() }.findAll { it }.toSet()
    wanted.add('core')
    if (wanted.contains('chat')) wanted.add('multiplayer')
    def unknown = wanted - all.toSet()
    if (unknown) throw new GradleException("unknown Slate module(s) in -PslateModules: ${unknown} (known: ${all})")
    return all.findAll { wanted.contains(it) }
}

dependencies {
    slateModules().each { m -> implementation project(path: ":${m}", configuration: 'namedElements') }
}

tasks.named('jar') { enabled = false }
tasks.named('remapJar') { enabled = false }
