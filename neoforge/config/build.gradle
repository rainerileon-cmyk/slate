base { archivesName = 'slate-config-neoforge-1.21.1' }

neoForge {
    mods { slate_config { sourceSet sourceSets.main } }
}

dependencies {
    implementation project(':core')
    // Sodium 0.8's config model (soft dep). This is the extracted INNER mod jar - see libs/README.md.
    compileOnly fileTree(dir: rootProject.slateLibsDir, include: ['sodium*.jar', 'iris*.jar'])
}
