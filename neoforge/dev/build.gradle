// Dev runner: no sources of its own, just a client run with every module loaded.
// `./gradlew :dev:runClient`
evaluationDependsOn(':core')
evaluationDependsOn(':menu')
evaluationDependsOn(':multiplayer')
evaluationDependsOn(':chat')
evaluationDependsOn(':config')
evaluationDependsOn(':building')

base { archivesName = 'slate-dev' }

// Harness / screenshot system properties shared by every client run (`gameDir` is the run's game directory).
def harnessProperties = { run, File gameDir ->
    if (project.hasProperty('buildingHarness')) {
        // Slate Building scenario runs: -PbuildingHarness=smoke,render [-PautoSkin=VANILLA]. The building
        // harness creates its own flat world and quits by itself, so Core's screenshot harness stays off
        // for this run (it would open a second world and quit underneath the scenarios).
        run.systemProperty 'slate.building.harness', project.buildingHarness.toString()
        if (project.hasProperty('autoSkin')) run.systemProperty 'slate.autoSkin', project.autoSkin.toString()
        if (project.hasProperty('autoLayout')) run.systemProperty 'slate.autoLayout', project.autoLayout.toString()
    } else if (project.hasProperty('autoScreens') || project.hasProperty('autoWorld')) {
        // Unattended screenshot runs: -PautoScreens=slate:hub,slate:settings [-PautoSkin=VANILLA] [-PautoQuit=true]
        if (project.hasProperty('autoScreens')) run.systemProperty 'slate.autoScreens', project.autoScreens.toString()
        run.systemProperty 'slate.autoDir', gameDir.absolutePath
        run.systemProperty 'slate.autoQuit', project.hasProperty('autoQuit') ? project.autoQuit.toString() : 'true'
        if (project.hasProperty('autoSkin')) run.systemProperty 'slate.autoSkin', project.autoSkin.toString()
        if (project.hasProperty('autoLayout')) run.systemProperty 'slate.autoLayout', project.autoLayout.toString()
        if (project.hasProperty('autoWorld')) run.systemProperty 'slate.autoWorld', project.autoWorld.toString()
        if (project.hasProperty('autoWorldScreens')) run.systemProperty 'slate.autoWorldScreens', project.autoWorldScreens.toString()
        if (project.hasProperty('autoFrames')) run.systemProperty 'slate.autoFrames', project.autoFrames.toString()
    }
}

// Which modules are on the dev runtime: all of them, or the ones named in -PslateModules=core,menu,config (the
// install matrix of docs/LAYOUTS-PLAN.md §7; a module left out is absent, exactly like a missing jar). Core is
// always on, and the modules a listed one depends on are added (chat needs multiplayer).
def slateModules = { ->
    def all = ['core', 'menu', 'multiplayer', 'chat', 'config', 'building']
    if (!project.hasProperty('slateModules')) return all
    def wanted = project.slateModules.toString().split(',').collect { it.trim() }.findAll { it }.toSet()
    wanted.add('core')
    if (wanted.contains('chat')) wanted.add('multiplayer')
    def unknown = wanted - all.toSet()
    if (unknown) throw new GradleException("unknown Slate module(s) in -PslateModules: ${unknown} (known: ${all})")
    return all.findAll { wanted.contains(it) }
}
ext.slateModuleIds = ['core': 'slate', 'menu': 'slate_menu', 'multiplayer': 'slate_multiplayer', 'chat': 'slate_chat', 'config': 'slate_config', 'building': 'slate_building']

neoForge {
    mods {
        slateModules().each { m ->
            "${slateModuleIds[m]}" { sourceSet project(":${m}").sourceSets.main }
        }
    }
    runs {
        client {
            client()
            gameDirectory = file('run')
            harnessProperties(delegate, file('run'))
        }
        // DF-pack compatibility run (`:dev:runClientCompat`, same harness properties as `client`): its own game
        // directory whose mods/ holds copies of the DF pack's production jars (Sodium, Iris, Create, Diagonal*,
        // KleeSlabs, JEI, Curios, OPAC, Shoulder Surfing, Relics, BetterInventory). NeoForge 1.21.1 production
        // jars are mojmap, so they load next to the dev sources as they are. Populate it with
        // tools/compat/populate-run-compat.sh; the compat scenarios are `-PbuildingHarness=compat-*`.
        clientCompat {
            client()
            gameDirectory = file('run-compat')
            jvmArgument '-Xmx4G'
            harnessProperties(delegate, file('run-compat'))
        }
        server {
            server()
            gameDirectory = file('run-server')
            programArgument '--nogui'
        }
    }
}

dependencies {
    slateModules().each { m -> implementation project(":${m}") }
}

// Nothing to ship from here.
tasks.named('jar') { enabled = false }
