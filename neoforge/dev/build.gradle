// Dev runner: no sources of its own, just a client run with every module loaded.
// `./gradlew :dev:runClient`
evaluationDependsOn(':core')
evaluationDependsOn(':menu')
evaluationDependsOn(':multiplayer')
evaluationDependsOn(':chat')
evaluationDependsOn(':config')

base { archivesName = 'slate-dev' }

neoForge {
    mods {
        slate { sourceSet project(':core').sourceSets.main }
        slate_menu { sourceSet project(':menu').sourceSets.main }
        slate_multiplayer { sourceSet project(':multiplayer').sourceSets.main }
        slate_chat { sourceSet project(':chat').sourceSets.main }
        slate_config { sourceSet project(':config').sourceSets.main }
    }
    runs {
        client {
            client()
            gameDirectory = file('run')
            // Unattended screenshot runs: -PautoScreens=slate:hub,slate:settings [-PautoSkin=VANILLA] [-PautoQuit=true]
            if (project.hasProperty('autoScreens') || project.hasProperty('autoWorld')) {
                if (project.hasProperty('autoScreens')) systemProperty 'slate.autoScreens', project.autoScreens.toString()
                systemProperty 'slate.autoDir', file('run').absolutePath
                systemProperty 'slate.autoQuit', project.hasProperty('autoQuit') ? project.autoQuit.toString() : 'true'
                if (project.hasProperty('autoSkin')) systemProperty 'slate.autoSkin', project.autoSkin.toString()
                if (project.hasProperty('autoWorld')) systemProperty 'slate.autoWorld', project.autoWorld.toString()
                if (project.hasProperty('autoFrames')) systemProperty 'slate.autoFrames', project.autoFrames.toString()
            }
        }
        server {
            server()
            gameDirectory = file('run-server')
            programArgument '--nogui'
        }
    }
}

dependencies {
    implementation project(':core')
    implementation project(':menu')
    implementation project(':multiplayer')
    implementation project(':chat')
    implementation project(':config')
}

// Nothing to ship from here.
tasks.named('jar') { enabled = false }
