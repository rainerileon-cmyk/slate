pluginManagement {
    repositories {
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
    }
}

rootProject.name = 'slate-neoforge'

// Order matters only for readability; inter-module dependencies are declared per project.
include 'core', 'menu', 'multiplayer', 'chat', 'config', 'building', 'profile', 'earlywindow', 'dev'
